; PlantTalk 펌웨어 - Seeed Studio XIAO Soil Moisture Sensor (XIAO ESP32-C6 내장)
; ESP32-C6 는 Arduino core 3.x 가 필요해서 공식 platform-espressif32 대신 pioarduino 를 쓴다.

[env:xiao_soil]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
; Wi-Fi + BLE 스택을 같이 넣으면 기본 앱 파티션(1.3MB)을 넘는다. OTA 를 쓰지 않으므로 3MB 단일 앱 파티션을 쓴다.
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
