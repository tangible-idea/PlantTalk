<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlantTalk</title>
<style>
  /* 글꼴과 색은 udo 앱(Paperlogy + Barlow Condensed, 연녹색 바탕 + 라임 포인트)을 따른다.
     글꼴은 SIL OFL 1.1 (public/fonts/*-OFL.txt), 한글 음절·기본 기호만 남긴 woff2 */
  @font-face { font-family: Paperlogy; src: url(fonts/Paperlogy-4Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(fonts/Paperlogy-5Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(fonts/Paperlogy-6SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(fonts/Paperlogy-7Bold.woff2) format("woff2"); font-weight: 700 900; font-display: swap; }
  @font-face { font-family: BarlowCondensed; src: url(fonts/BarlowCondensed-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }

  :root {
    --bg: #f4f6f3; --card: #ffffff; --ink: #17211d; --muted: #68756d; --line: #e1e7de;
    --green: #426b31; --lime: #cafa68; --on-lime: #17211d; --selection: #f0f7e8;
    --teal: #327d80; --amber: #916020; --warning: #fff4e3; --red: #b23a2e; --red-soft: #fdecea; --teal-soft: #e5f2f2;
    --chart-moisture: #2e8540; --chart-battery: #7b5bb5;
    --chat-bg: #eef2ec; --mine: var(--lime); --mine-ink: var(--on-lime); --theirs: #ffffff;
    --shadow: 0 1px 2px rgba(23, 33, 29, .04), 0 8px 24px rgba(23, 33, 29, .04);
    --font: Paperlogy, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    --num: BarlowCondensed, Paperlogy, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1311; --card: #151d1b; --ink: #e8eee9; --muted: #93a098; --line: #26302c;
      --green: #9bcb7e; --selection: #1d2a20;
      --teal: #6fb9bb; --amber: #e0a85a; --warning: #2e2617; --red: #f08a7e; --red-soft: #3a1f1c; --teal-soft: #17292a;
      --chart-moisture: #4fa85e; --chart-battery: #9273d6;
      --chat-bg: #101816; --theirs: #1d2724;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink);
         letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  .num { font-family: var(--num); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0; }

  header { max-width: 1140px; margin: 0 auto; padding: 22px 20px 6px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 13px; background: var(--lime); display: grid; place-items: center; font-size: 21px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
  header p { margin: 1px 0 0; color: var(--muted); font-size: 13px; }
  .weather { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line);
             border-radius: 16px; padding: 7px 14px; font-size: 12px; color: var(--muted); }
  .weather[hidden] { display: none; }
  .weather .num { font-size: 22px; color: var(--ink); line-height: 1; }
  .weather b { color: var(--ink); font-weight: 600; font-size: 13px; display: block; }
  main { max-width: 1140px; margin: 0 auto; padding: 16px 20px 28px; display: grid; gap: 20px;
         grid-template-columns: minmax(0, 1fr) minmax(0, 400px); }
  @media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 24px; } header { padding: 18px 16px 2px; } }
  h2 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

  .plants { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
  .plant-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .plant-head b { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .species { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .s-dry { background: var(--red-soft); color: var(--red); }
  .s-thirsty { background: var(--warning); color: var(--amber); }
  .s-ok { background: var(--selection); color: var(--green); }
  .s-soggy { background: var(--teal-soft); color: var(--teal); }
  .s-none { background: var(--bg); color: var(--muted); }
  .moisture { display: flex; align-items: baseline; gap: 6px; margin: 12px 0 2px; }
  .moisture .num { font-size: 52px; line-height: 1; }
  .moisture small { font-size: 14px; color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.5; }
  .meta .num { font-size: 13px; color: var(--ink); }

  /* 카드 안 작은 추이 그래프 (흙 수분, 배터리 각각 따로. 축 하나 = 0~100%) */
  .mini { margin-top: 14px; position: relative; }
  .mini-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .mini-head b { font-family: var(--num); font-weight: 600; font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mini-head .key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .mini svg { display: block; width: 100%; height: 46px; margin-top: 6px; overflow: visible; cursor: crosshair; }
  .mini .range { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 3px; }
  .mini .tip { position: absolute; top: 20px; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
               background: var(--ink); color: var(--card); font-size: 12px; padding: 4px 8px; border-radius: 8px; }

  .no-data { margin-top: 14px; padding: 18px 12px; border: 1px dashed var(--line); border-radius: 14px; text-align: center;
             color: var(--muted); font-size: 12px; line-height: 1.6; white-space: pre-line; }
  .row { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px;
           padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  button:hover { background: var(--selection); border-color: var(--selection); }
  button.primary { background: var(--lime); border-color: var(--lime); color: var(--on-lime); border-radius: 16px; font-weight: 700; }
  button.primary:hover { filter: brightness(.96); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .sim { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 14px;
         padding: 10px 12px; background: var(--bg); border-radius: 14px; }
  .sim input { flex: 1; min-width: 0; accent-color: var(--green); }
  .sim .num { color: var(--ink); font-size: 14px; min-width: 32px; text-align: right; }
  .sim button { padding: 5px 10px; }

  /* 채팅방 */
  .chat { display: flex; flex-direction: column; height: min(84vh, 780px); padding: 0; overflow: hidden; position: sticky; top: 16px; }
  @media (max-width: 880px) { .chat { position: static; } }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .chat-head .title { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
  .chat-head .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .members { display: flex; margin-left: auto; }
  .members .avatar { width: 30px; height: 30px; font-size: 15px; margin-left: -7px; border: 2px solid var(--card); position: relative; overflow: visible; }
  .members .dot { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--card); }
  .dot.s-dry { background: var(--red); } .dot.s-thirsty { background: var(--amber); }
  .dot.s-ok { background: var(--green); } .dot.s-soggy { background: var(--teal); } .dot.s-none { background: var(--muted); }
  .log { flex: 1; overflow-y: auto; padding: 14px 14px 8px; background: var(--chat-bg); display: flex; flex-direction: column; }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--card); border-radius: 99px;
         padding: 4px 12px; margin: 12px 0 6px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; max-width: 100%; }
  .msg.cont { margin-top: 4px; }
  .msg[hidden] { display: none; }
  .msg.cont .avatar { visibility: hidden; height: 0; }
  .avatar { flex: none; width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center;
            font-size: 19px; overflow: hidden; color: #fff; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg .body { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .msg .who { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px 2px; }
  .msg .line { display: flex; align-items: flex-end; gap: 5px; max-width: 100%; }
  .bubble { padding: 9px 13px; border-radius: 4px 16px 16px 16px; background: var(--theirs); line-height: 1.5;
            white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; max-width: min(76vw, 300px); font-size: 14px;
            box-shadow: 0 1px 1px rgba(23, 33, 29, .05); }
  .msg.cont .bubble { border-radius: 16px; }
  .time { flex: none; font-size: 10px; color: var(--muted); padding-bottom: 3px; }
  .msg.owner { flex-direction: row-reverse; }
  .msg.owner .body { align-items: flex-end; }
  .msg.owner .line { flex-direction: row-reverse; }
  .msg.owner .bubble { background: var(--mine); color: var(--mine-ink); border-radius: 16px 4px 16px 16px; box-shadow: none; }
  .msg.owner.cont .bubble { border-radius: 16px; }
  .typing { display: flex; gap: 4px; padding: 12px 14px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; white-space: pre-line; line-height: 1.6; }
  .compose { display: flex; gap: 8px; align-items: flex-end; padding: 12px; border-top: 1px solid var(--line); background: var(--card); }
  .compose textarea { flex: 1; min-width: 0; min-height: 44px; max-height: 120px; resize: none; padding: 11px 14px;
                      border-radius: 16px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
                      font: inherit; font-size: 14px; line-height: 1.45; }
  .compose button { height: 44px; padding: 0 18px; }
  .chat .error { padding: 0 14px 10px; background: var(--card); }

  dialog { border: 1px solid var(--line); border-radius: 22px; background: var(--card); color: var(--ink);
           width: min(520px, calc(100vw - 32px)); padding: 22px; }
  dialog::backdrop { background: rgba(23, 33, 29, .4); }
  dialog h2 { margin-bottom: 6px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 12px; }
  label input, label textarea { display: block; width: 100%; margin-top: 5px; padding: 10px 12px; border-radius: 14px;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 400; font-size: 14px; }
  textarea { min-height: 60px; resize: vertical; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .notice { font-size: 13px; color: var(--muted); }
  .error { color: var(--red); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">🌱</div>
  <div>
    <h1>PlantTalk</h1>
    <p>식물이 직접 말해주는 스마트 화분</p>
  </div>
  <div class="weather" id="weather" hidden title="바깥 날씨"></div>
</header>
<main>
  <section>
    <div class="section-head">
      <h2>내 식물</h2>
      <button id="add">+ 식물 추가</button>
    </div>
    <div class="plants" id="plants"></div>
    <p class="notice" id="unknown"></p>
  </section>
  <section class="card chat">
    <div class="chat-head">
      <div>
        <div class="title">우리집 식물 단톡방</div>
        <div class="sub" id="chat-sub"></div>
      </div>
      <div class="members" id="members"></div>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="compose" id="compose">
      <textarea id="text" rows="1" placeholder="식물들에게 말 걸기…" aria-label="메시지"></textarea>
      <button class="primary">전송</button>
    </form>
    <div class="error" id="chat-error"></div>
  </section>
</main>

<dialog id="editor">
  <form id="plant-form" method="dialog">
    <h2 id="editor-title">식물 설정</h2>
    <label>ID (영문 소문자) <input name="id" required pattern="[a-z0-9-]{1,40}"></label>
    <label>이름 <input name="name" required></label>
    <label>품종 <input name="species"></label>
    <label>센서 기기 ID (펌웨어 DEVICE_ID) <input name="deviceId"></label>
    <label>성격 <textarea name="personality"></textarea></label>
    <label>말투 <textarea name="speechStyle"></textarea></label>
    <label>예시 대사 <input name="sampleLine"></label>
    <label>아바타 이미지 URL <input name="avatarUrl"></label>
    <div class="grid3">
      <label>바싹 마름 &lt; % <input name="dry" type="number" min="0" max="100"></label>
      <label>목마름 &lt; % <input name="thirsty" type="number" min="0" max="100"></label>
      <label>과습 &gt; % <input name="soggy" type="number" min="0" max="100"></label>
    </div>
    <div class="error" id="form-error"></div>
    <div class="row" style="justify-content:space-between">
      <button type="button" id="delete">삭제</button>
      <span class="row" style="margin:0">
        <button type="button" id="cancel">취소</button>
        <button class="primary" id="save">저장</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const STATUS = { dry: "바싹 마름", thirsty: "목마름", ok: "적당함", soggy: "과습" };
let plants = [];
let lastChatId = 0;
let config = { adminRequired: false };

function token() {
  try { return localStorage.getItem("planttalk-admin") || ""; } catch { return ""; }
}

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token()) headers.Authorization = `Bearer ${token()}`;
  let res = await fetch(path, { ...options, headers });
  if (res.status === 401) {
    const t = window.prompt("관리자 토큰(ADMIN_TOKEN)을 입력하세요");
    if (!t) throw new Error("관리자 토큰이 필요합니다");
    try { localStorage.setItem("planttalk-admin", t); } catch {}
    headers.Authorization = `Bearer ${t}`;
    res = await fetch(path, { ...options, headers });
  }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
  return res.status === 204 ? null : res.json();
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

const hhmm = (d) => d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 1440) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
}

// 0~100% 값 하나를 시간 순으로 그리는 작은 선 그래프. 마우스를 올리면 그 시점의 시간과 값을 보여 준다.
function miniChart(history, { key, label, color }) {
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    return n;
  };
  const pts = history.filter((r) => typeof r[key] === "number");
  const last = pts.at(-1);
  const box = el("div", { class: "mini" },
    el("div", { class: "mini-head" },
      el("span", {}, el("span", { class: "key", style: `background:${color}` }), label),
      el("b", {}, last ? `${Math.round(last[key])}%` : "–")));
  const svg = svgEl("svg", { viewBox: "0 0 100 40", preserveAspectRatio: "none", role: "img",
    "aria-label": `${label} 추이${last ? `, 최근 ${Math.round(last[key])}%` : ""}` });
  // 50% 기준선만 옅게
  svg.append(svgEl("line", { x1: 0, x2: 100, y1: 20, y2: 20, stroke: "var(--line)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" }));
  box.append(svg);
  if (pts.length < 2) return box;

  const x = (i) => (i / (pts.length - 1)) * 100;
  const y = (v) => 39 - (Math.max(0, Math.min(100, v)) / 100) * 38;
  svg.append(svgEl("polyline", { points: pts.map((r, i) => `${x(i)},${y(r[key])}`).join(" "), fill: "none",
    stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
  const cross = svgEl("line", { y1: 0, y2: 40, stroke: "var(--muted)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
  svg.append(cross);
  const tip = el("div", { class: "tip", hidden: "" });
  box.append(tip, el("div", { class: "range" }, el("span", {}, hhmm(new Date(pts[0].ts))), el("span", {}, hhmm(new Date(last.ts)))));

  svg.addEventListener("pointermove", (e) => {
    const rect = svg.getBoundingClientRect();
    const i = Math.round(((e.clientX - rect.left) / rect.width) * (pts.length - 1));
    const r = pts[Math.max(0, Math.min(pts.length - 1, i))];
    const px = x(pts.indexOf(r));
    cross.setAttribute("x1", px);
    cross.setAttribute("x2", px);
    cross.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.textContent = `${hhmm(new Date(r.ts))} · ${Math.round(r[key])}%`;
    tip.style.left = `${Math.max(30, Math.min(rect.width - 30, (px / 100) * rect.width))}px`;
  });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; });
  return box;
}

// 센서가 보내는 원시 값들. 칩 온도는 ESP32 내부 온도라 실내 기온보다 높다.
function sensorDetails(r) {
  const parts = [`흙 ${r.soilVoltage}V`, `배터리 ${r.batteryVoltage}V`];
  if (r.chipTemp != null) parts.push(`칩 온도 ${r.chipTemp}°C`);
  if (r.rssi != null) parts.push(`${r.transport === "ble" ? "BLE" : "Wi-Fi"} ${r.rssi}dBm`);
  if (r.uptime != null) parts.push(`가동 ${Math.floor(r.uptime / 60)}분`);
  return parts.join(" · ");
}

function renderPlants(data) {
  plants = data.plants;
  const box = document.getElementById("plants");
  box.replaceChildren(...plants.map((p) => {
    const r = p.latest;
    const slider = el("input", { type: "range", min: 0, max: 100, value: r ? Math.round(r.moisture) : 50 });
    const sliderValue = el("span", { class: "num" }, `${slider.value}%`);
    slider.addEventListener("input", () => (sliderValue.textContent = `${slider.value}%`));
    return el("div", { class: "card" },
      el("div", { class: "plant-head" },
        el("div", {}, el("b", {}, p.name), " ", el("span", { class: "species" }, p.species)),
        el("span", { class: `badge s-${r ? r.status : "none"}` }, r ? STATUS[r.status] : "데이터 없음")),
      el("div", { class: "moisture" }, el("span", { class: "num" }, r ? `${r.moisture}` : "–"), el("small", {}, "% 흙 수분")),
      el("div", { class: "meta" },
        r ? `${ago(r.ts)} 측정 · 배터리 ${r.battery}% · 기기 ${p.deviceId || "미연결"}` : `기기 ${p.deviceId || "미연결"}`),
      r && r.soilVoltage != null ? el("div", { class: "meta" }, sensorDetails(r)) : null,
      ...(p.history.length
        ? [miniChart(p.history, { key: "moisture", label: "흙 수분", color: "var(--chart-moisture)" }),
           miniChart(p.history, { key: "battery", label: "배터리", color: "var(--chart-battery)" })]
        : [el("div", { class: "no-data" }, "아직 센서 기록이 없어요.\n센서를 연결하거나 아래 시뮬레이션으로 값을 보내 보세요.")]),
      el("div", { class: "sim" }, "시뮬레이션", slider, sliderValue,
        el("button", { onclick: () => simulate(p.id, slider.value) }, "보내기")),
      el("div", { class: "row" }, el("button", { onclick: () => openEditor(p) }, "캐릭터 설정")));
  }));

  renderMembers();

  const unknown = Object.keys(data.unknownDevices || {});
  document.getElementById("unknown").textContent = unknown.length
    ? `연결되지 않은 센서가 데이터를 보내고 있어요: ${unknown.join(", ")} — 식물 설정의 '센서 기기 ID'에 입력하세요.` : "";
}

let lastPlantsJson = "";
async function loadPlants() {
  const data = await api("/api/plants");
  const json = JSON.stringify(data);
  if (json === lastPlantsJson) return;  // 바뀐 게 없으면 다시 그리지 않는다 (슬라이더 조작 유지)
  lastPlantsJson = json;
  renderPlants(data);
}

async function simulate(id, moisture) {
  try {
    await api(`/api/plants/${id}/simulate`, { method: "POST", body: JSON.stringify({ moisture: Number(moisture), battery: 90 }) });
    await loadPlants();
  } catch (e) { alertError(e); }
}

function alertError(e) {
  document.getElementById("chat-error").textContent = e.message;
}

// ---- 채팅방
const AVATAR_COLORS = ["#4f8a5b", "#c0763a", "#6a6fc0", "#b0507a", "#3a8a99", "#8a7a2f"];

function avatar(plant, fallbackName) {
  const box = el("div", { class: "avatar" });
  if (plant?.avatarUrl) {
    box.append(el("img", { src: plant.avatarUrl, alt: "" }));
  } else {
    const i = Math.max(0, plants.findIndex((p) => p.id === plant?.id));
    box.style.background = AVATAR_COLORS[i % AVATAR_COLORS.length];
    box.textContent = plant ? "🌿" : (fallbackName || "?").slice(0, 1);
  }
  return box;
}

function renderMembers() {
  const box = document.getElementById("members");
  box.replaceChildren(...plants.map((p) => {
    const a = avatar(p);
    a.title = `${p.name} · ${p.latest ? STATUS[p.latest.status] : "데이터 없음"}`;
    a.append(el("span", { class: `dot s-${p.latest ? p.latest.status : "none"}` }));
    return a;
  }));
  document.getElementById("chat-sub").textContent = `식물 ${plants.length} · ${config.owner || "주인"}`;
}

const log = document.getElementById("log");
const typingRow = el("div", { class: "msg", hidden: "" },
  el("div", { class: "avatar", style: "background:var(--line)" }, "🌱"),
  el("div", { class: "body" }, el("div", { class: "bubble typing", "aria-label": "식물들이 입력 중" }, el("i"), el("i"), el("i"))));
log.append(typingRow);
let prevMsg = null;

const dayLabel = (d) => d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });

function renderMessage(m) {
  const at = new Date(m.ts);
  if (!prevMsg || new Date(prevMsg.ts).toDateString() !== at.toDateString()) {
    log.insertBefore(el("div", { class: "day" }, dayLabel(at)), typingRow);
    prevMsg = null;
  }
  // 같은 사람이 3분 안에 이어서 말하면 아바타와 이름을 생략한다
  const cont = prevMsg && prevMsg.role === m.role && prevMsg.author === m.author && at - new Date(prevMsg.ts) < 3 * 60 * 1000;
  const plant = m.role === "plant" ? plants.find((p) => p.id === m.plantId) : null;
  const via = m.source && m.source !== "web" ? ` · ${m.source}` : "";
  log.insertBefore(el("div", { class: `msg ${m.role}${cont ? " cont" : ""}` },
    m.role === "owner" ? null : avatar(plant, m.author),
    el("div", { class: "body" },
      cont || m.role === "owner" ? null : el("div", { class: "who" }, m.author),
      el("div", { class: "line" }, el("div", { class: "bubble" }, m.text), el("span", { class: "time" }, hhmm(at) + via)))),
    typingRow);
  prevMsg = m;
}

async function loadChat() {
  const { messages, typing } = await api(`/api/chat?after=${lastChatId}`);
  const stick = lastChatId === 0 || log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  for (const m of messages) {
    lastChatId = m.id;
    renderMessage(m);
  }
  typingRow.hidden = !typing;
  const empty = log.querySelector(".empty");
  if (prevMsg && empty) empty.remove();
  if (!prevMsg && !empty) log.prepend(el("div", { class: "empty" }, "아직 대화가 없어요.\n식물들에게 먼저 말을 걸어 보세요."));
  if (stick && (messages.length || typing)) log.scrollTop = log.scrollHeight;
}

const composeForm = document.getElementById("compose");
const input = document.getElementById("text");
const autosize = () => { input.style.height = "auto"; input.style.height = `${input.scrollHeight + 2}px`; };
input.addEventListener("input", autosize);
// Enter 로 보내고 Shift+Enter 로 줄바꿈. 한글 조합 중에 누른 Enter 는 무시한다.
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    composeForm.requestSubmit();
  }
});
composeForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  autosize();
  document.getElementById("chat-error").textContent = "";
  try {
    await api("/api/chat", { method: "POST", body: JSON.stringify({ text }) });
    typingRow.hidden = false;
    await loadChat();
    log.scrollTop = log.scrollHeight;
  } catch (err) { alertError(err); input.value = text; autosize(); }
});

const editor = document.getElementById("editor");
const form = document.getElementById("plant-form");
let editingId = null;

function openEditor(p) {
  editingId = p ? p.id : null;
  document.getElementById("editor-title").textContent = p ? `${p.name} 설정` : "새 식물";
  document.getElementById("form-error").textContent = "";
  document.getElementById("delete").hidden = !p;
  form.id.value = p?.id ?? "";
  form.id.readOnly = Boolean(p);
  for (const k of ["name", "species", "deviceId", "personality", "speechStyle", "sampleLine", "avatarUrl"]) form[k].value = p?.[k] ?? "";
  form.dry.value = p?.thresholds?.dry ?? 25;
  form.thirsty.value = p?.thresholds?.thirsty ?? 45;
  form.soggy.value = p?.thresholds?.soggy ?? 85;
  editor.showModal();
}

document.getElementById("add").addEventListener("click", () => openEditor(null));
document.getElementById("cancel").addEventListener("click", () => editor.close());
document.getElementById("delete").addEventListener("click", async () => {
  if (!editingId) return;
  try { await api(`/api/plants/${editingId}`, { method: "DELETE" }); editor.close(); loadPlants(); }
  catch (e) { document.getElementById("form-error").textContent = e.message; }
});
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    name: form.name.value, species: form.species.value, deviceId: form.deviceId.value,
    personality: form.personality.value, speechStyle: form.speechStyle.value,
    sampleLine: form.sampleLine.value, avatarUrl: form.avatarUrl.value,
    thresholds: { dry: Number(form.dry.value), thirsty: Number(form.thirsty.value), soggy: Number(form.soggy.value) },
  };
  try {
    await api(`/api/plants/${encodeURIComponent(form.id.value.trim().toLowerCase())}`, { method: "PUT", body: JSON.stringify(body) });
    editor.close();
    loadPlants();
  } catch (err) { document.getElementById("form-error").textContent = err.message; }
});

async function loadWeather() {
  const { weather: w, forecast: f, calendar: c } = await api("/api/outdoor");
  const box = document.getElementById("weather");
  box.hidden = !w;
  if (!w) return;
  // 오늘 최저/최고와 강수확률은 기상청 예보가 있으면 그쪽을 쓴다
  const today = f?.today ?? { min: w.today.min, max: w.today.max, rainChance: w.today.rain };
  const parts = [`오늘 ${Math.round(today.min)}° / ${Math.round(today.max)}°`, `비 ${today.rainChance}%`];
  if (w.air) parts.push(`미세먼지 ${w.air.pm25Grade}`);
  const off = c?.today.holiday ?? (c?.tomorrow.holiday ? `내일 ${c.tomorrow.holiday}` : null);
  box.replaceChildren(
    el("span", { class: "num" }, `${Math.round(w.temp)}°`),
    el("div", {}, el("b", {}, [w.place, w.label, off].filter(Boolean).join(" · ")), parts.join(" · ")));
  box.title = `바깥 날씨 (Open-Meteo${f ? ", 기상청 단기예보" : ""})`;
}

async function tick() {
  try {
    await loadPlants();  // 채팅 아바타가 식물 목록을 쓰므로 먼저
    await loadChat();
  } catch (e) { console.error(e); }
}
api("/api/config").then((c) => { config = c; }).catch(() => {}).finally(() => {
  tick();
  setInterval(tick, 2500);
  loadWeather().catch(() => {});
  setInterval(() => loadWeather().catch(() => {}), 5 * 60 * 1000);  // 입력 중 표시와 답장이 빨리 보이도록
});
</script>
